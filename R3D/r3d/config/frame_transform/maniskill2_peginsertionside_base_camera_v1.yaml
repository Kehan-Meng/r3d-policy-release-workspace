config_version: 1
name: maniskill2_peginsertionside_base_camera_v1
benchmark: maniskill2
task: PegInsertionSide
canonical_frame: maniskill_peginsertion_base_camera_cv
require_metadata: true
status: supported_static_historical_dataset_profile
semantic_alignment: true
data_operation:
  type: coordinate_reexpression
  point_selection_preserved: true
  rerendered_from_depth: false
provenance:
  point_cloud_wrapper: R3D/r3d/env/maniskill2/mani_skill2/utils/wrappers/observation.py
