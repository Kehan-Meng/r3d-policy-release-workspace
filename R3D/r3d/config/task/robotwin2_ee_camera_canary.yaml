name: ${task_name}-ee-camera-canary

shape_meta:
  obs:
    point_cloud:
      shape: [1024, 6]
      type: point_cloud
    agent_pos:
      shape: [30]
      type: low_dim
  action:
    shape: [16]

# Phase 4G-1 is an offline overfit gate. Environment execution is validated
# separately after the production action head has demonstrated learnability.
env_runner: null

dataset:
  _target_: r3d.dataset.robotwin2_ee_camera_dataset.Robotwin2EECameraDataset
  zarr_path: ???
  task_name: ${task_name}
  horizon: ${horizon}
  pad_before: 0
  pad_after: 0
  seed: 42
  val_ratio: 0.0
  max_train_episodes: null
  text_json_path: R3D/config/instruction_bank_robotwin2_affogato_v2.json
  return_text: ${policy.use_text}
  strict_text_lookup: false
