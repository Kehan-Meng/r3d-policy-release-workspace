extends: door_v5_masked_cosine.yaml

experiment:
  name: adroit_door_v5_masked_cosine_oc
  output_dir: outputs/adroit_door_v5_masked_cosine_oc
  results_dir: experiments/results/adroit_door_v5_masked_cosine_oc

frame_adapter:
  enabled: true
  profile_path: R3D/r3d/config/frame_transform/adroit_door_legacy_camera_v1.yaml
