  allow_frame_config_override: false
  normalizer:
    train_split_only: true
    chunk_size: 2048

report:
  variant: oc_compmq01_tau15_rawdiv0p01_maskedcos_ata1e3
  frame_adapter_enabled: true
  frame_profile: adroit_door_legacy_camera_v1
  frame_scope: pointcloud_xyz_camera_reexpression_state_action_native_passthrough
